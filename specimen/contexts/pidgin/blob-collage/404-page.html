<!DOCTYPE html>
<html lang="en-US">
<head>
<title>404 Page - Context</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

    body {
        display: grid;
        grid-template-columns: 5% 3% 6% 6% 15% 30% 15% 6% 6% 3% 5%;
        overflow-x: hidden;
        font-family: Helvetica;
        font-weight: 400;
        -moz-osx-font-smoothing: grayscale;
        -webkit-font-smoothing: antialiased;
    }

    main {
        display: grid;
        grid-template-columns: subgrid;
        width: 100%;
        margin: 0;
        margin-bottom: 8em;
        padding: 0;
        grid-column: 1 / 12;
    }

    main > * {
        grid-column: 5 / span 3;
    }

    main header {
        /* grid-column: 2 / 11; */
        /* display: grid; */
        /* grid-template-columns: 1fr 1fr; */
        margin-top: 4em;
        justify-content: center;
        /* margin-bottom: 4em; */
        padding-top: 2em;
        padding-bottom: 1em;
        position: relative;

        /* text-align: center; */
        color: #333;
    }

    main > header h1 {
        width: 100%;
        margin: 0;
        /* padding-left: 2em; */
        display: inline-block;
        box-sizing: border-box;

        font-family: Helvetica;
        font-size: 3.7em;
        font-style: normal;
        font-weight: 400;
    }

    main a {
        --underline-background-color: #ADFF00;
        display: inline-block;
        box-sizing: border-box;
        margin-top: 1em;
        padding: .6em 1.6em;
        
        font-weight: 400;
        text-decoration: none;
        font-size: 1.2em;
        background: #ADFF00;
        color: black;
        border-radius: 60px;
        text-transform: capitalize;
        border: 4px solid transparent;
    }

    main a:hover {
        color: white;
        background: black;
    }

    main p {
        /* margin-bottom: 2em; */

        font-family: Helvetica;
        font-size: 1.5em;
        font-style: normal;
        font-weight: 400;
        line-height: 150%;
    }

</style>
</head>

<body>
<main>

<header>
    <h1>Not Found</h1>
</header>

<div class="content">
    <p>The requested URL was not found on this server.</p>
    <a href="/">Return home</a>
</div>

</main>
</body>
</html>
